<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lull</title>
  <meta name="description" content="A calm sleep journal for your Home Screen: track sleep, naps, dreams and habits.">
  <meta name="theme-color" content="#0B0F33">
  <meta name="color-scheme" content="dark">

  <!-- Home Screen app behaviour -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lull">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">

  <!-- Fonts: cached by the service worker after the first visit, so they work offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&display=swap">

  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/ui.js">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>
  <div class="night-veil" aria-hidden="true"></div>

  <div id="app">
    <main class="views">
      <section class="view" id="view-tonight" data-view="tonight" aria-label="Tonight"></section>
      <section class="view" id="view-journal" data-view="journal" aria-label="Journal"></section>
      <section class="view" id="view-trends" data-view="trends" aria-label="Trends"></section>
      <section class="view" id="view-winddown" data-view="winddown" aria-label="Wind down"></section>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#fff">Lull needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
